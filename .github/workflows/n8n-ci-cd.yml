name: NEXUS n8n CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Validate YAML
              run: |
                  find . -name "*.yml" -o -name "*.yaml" | xargs yamllint
            - name: Validate Terraform
              run: |
                  terraform fmt -check
                  terraform validate
            - name: Validate Kubernetes manifests
              run: |
                  kubeconform kubernetes/manifests/

    version:
        needs: validate
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Generate version
              id: version
              run: |
                  VERSION=$(git describe --tags --always --dirty)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

    test:
        needs: version
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
              env:
                  DATABASE_URL: postgresql://postgres:test@localhost:5432/test
                  REDIS_URL: redis://localhost:6379

    build:
        needs: [test, version]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=raw,value=${{ needs.version.outputs.version }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    deploy-staging:
        needs: [build, version]
        runs-on: ubuntu-latest
        environment: staging
        if: github.ref == 'refs/heads/develop'
        steps:
            - uses: actions/checkout@v4
            - name: Deploy to staging
              run: |
                  aws eks update-kubeconfig --region us-east-1 --name nexus-staging
                  helm upgrade --install nexus-n8n ./infrastructure/kubernetes/helm \
                    --namespace staging \
                    --set image.tag=${{ needs.version.outputs.version }} \
                    --set environment=staging

    deploy-production:
        needs: [build, version]
        runs-on: ubuntu-latest
        environment: production
        if: github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v4
            - name: Deploy to production
              run: |
                  aws eks update-kubeconfig --region us-east-1 --name nexus-production
                  helm upgrade --install nexus-n8n ./infrastructure/kubernetes/helm \
                    --namespace production \
                    --set image.tag=${{ needs.version.outputs.version }} \
                    --set environment=production \
                    --wait \
                    --timeout 600s

    monitoring:
        needs: deploy-production
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v4
            - name: Update monitoring rules
              run: |
                  aws eks update-kubeconfig --region us-east-1 --name nexus-production
                  kubectl apply -f infrastructure/monitoring/prometheus-rules.yml
            - name: Run smoke tests
              run: |
                  # Test health endpoints
                  curl -f https://nexus-api.production.com/health
                  # Test workflow execution
                  curl -f -X POST https://nexus-api.production.com/webhook/test-workflow

    backup:
        needs: deploy-production
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v4
            - name: Trigger backup
              run: |
                  aws lambda invoke --function-name nexus-backup-trigger \
                    --payload '{"environment": "production"}' \
                    output.json
